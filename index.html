<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Grand-Livre — Journal &amp; Stock</title>
<style>
  :root{
    --ink:#16342B;
    --ink-soft:#3C5A50;
    --bg:#EEF1ED;
    --panel:#FFFFFF;
    --line:#D7DED8;
    --amber:#B8742A;
    --amber-soft:#F1DFC4;
    --green:#2F6E4F;
    --green-soft:#DCEAE2;
    --red:#A23B2E;
    --red-soft:#F3DEDA;
    --shadow: 0 1px 0 rgba(22,52,43,0.06);
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-variant-numeric:tabular-nums; letter-spacing:-0.2px;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit; font-size:14px;}

  /* ---------- Login ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:32px 28px; box-shadow:var(--shadow);
  }
  .login-brand{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
  .login-brand img{width:44px; height:44px; object-fit:cover; border-radius:6px; border:1px solid var(--line);}
  .login-brand .mark{width:44px; height:44px; border-radius:6px; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px;}
  .login-brand h1{font-size:17px; margin:0; font-weight:700;}
  .login-brand p{margin:2px 0 0; font-size:12.5px; color:var(--ink-soft);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:var(--radius);
    background:#fbfcfb; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--green); outline-offset:1px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 16px; border-radius:var(--radius); border:1px solid transparent;
    font-size:14px; font-weight:600; cursor:pointer; transition:filter .12s ease;
  }
  .btn:hover{filter:brightness(0.94);}
  .btn-primary{background:var(--ink); color:#fff; width:100%;}
  .btn-outline{background:transparent; border:1px solid var(--line); color:var(--ink);}
  .btn-amber{background:var(--amber); color:#fff;}
  .btn-red{background:var(--red); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:none; text-decoration:underline; padding:6px 0;}
  .btn-sm{padding:6px 10px; font-size:12.5px;}
  .login-switch{margin-top:16px; text-align:center; font-size:13px; color:var(--ink-soft);}
  .login-switch a{color:var(--green); cursor:pointer; font-weight:600; text-decoration:none;}
  .error-msg{background:var(--red-soft); color:var(--red); padding:9px 11px; border-radius:var(--radius); font-size:13px; margin-bottom:14px;}
  .logo-upload{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .logo-upload .preview{width:44px;height:44px;border-radius:6px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fbfcfb;flex-shrink:0;}
  .logo-upload .preview img{width:100%;height:100%;object-fit:cover;}
  .logo-upload label.pick{font-size:12.5px; color:var(--green); cursor:pointer; text-decoration:underline;}

  /* ---------- App shell ---------- */
  #app-screen{display:none; min-height:100vh; flex-direction:column;}
  .topbar{
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    background:var(--ink); color:#fff; position:sticky; top:0; z-index:20;
  }
  .topbar img{width:28px;height:28px;border-radius:5px;object-fit:cover;}
  .topbar .mark{width:28px;height:28px;border-radius:5px;background:rgba(255,255,255,0.15); display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .topbar .brandname{font-weight:700; font-size:14.5px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topbar .logout{background:none;border:none;color:rgba(255,255,255,0.75);font-size:12.5px;cursor:pointer;}

  .tabs{
    display:flex; gap:4px; overflow-x:auto; padding:8px 10px; background:var(--panel);
    border-bottom:1px solid var(--line); position:sticky; top:52px; z-index:19;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex-shrink:0; padding:7px 12px; border-radius:20px; border:1px solid var(--line);
    background:#fff; color:var(--ink-soft); font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .tab-btn.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  main{padding:16px; flex:1; max-width:960px; width:100%; margin:0 auto;}
  .section{display:none;}
  .section.active{display:block;}

  h2.title{font-size:17px; margin:0 0 4px; font-weight:700;}
  p.subtitle{margin:0 0 16px; font-size:13px; color:var(--ink-soft);}

  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:20px;}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px;}
  .kpi .lbl{font-size:11.5px; color:var(--ink-soft); margin-bottom:6px;}
  .kpi .val{font-size:19px; font-weight:700;}
  .kpi.alert .val{color:var(--red);}
  .kpi.ok .val{color:var(--green);}
  .kpi.amber .val{color:var(--amber);}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px;}
  .panel h3{margin:0 0 12px; font-size:14.5px; font-weight:700;}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  @media(max-width:560px){ .grid-2,.grid-3{grid-template-columns:1fr;} }

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; padding:8px 10px; color:var(--ink-soft); font-size:11.5px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  .tbl-wrap{overflow-x:auto; margin-top:4px;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700;}
  .badge-in{background:var(--green-soft); color:var(--green);}
  .badge-out{background:var(--red-soft); color:var(--red);}
  .badge-warn{background:var(--amber-soft); color:var(--amber);}
  .badge-flat{background:#eee; color:var(--ink-soft);}
  .row-actions{display:flex; gap:6px;}
  .icon-btn{border:none; background:none; cursor:pointer; font-size:14px; padding:2px 4px; color:var(--ink-soft);}
  .icon-btn:hover{color:var(--ink);}
  .empty{padding:24px 10px; text-align:center; color:var(--ink-soft); font-size:13px;}

  .filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .filters select, .filters input{padding:7px 9px; border:1px solid var(--line); border-radius:var(--radius); font-size:12.5px; background:#fbfcfb;}

  .tag-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .tag{background:#f1f3f1; border:1px solid var(--line); border-radius:20px; padding:4px 10px; font-size:12px; display:flex; align-items:center; gap:6px;}
  .tag button{border:none;background:none;color:var(--red);cursor:pointer;font-size:12px;padding:0;}

  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(22,52,43,0.4); z-index:50; align-items:flex-end; justify-content:center;}
  .modal-overlay.active{display:flex;}
  @media(min-width:640px){ .modal-overlay{align-items:center;} }
  .modal{background:#fff; border-radius:12px 12px 0 0; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:20px;}
  @media(min-width:640px){ .modal{border-radius:var(--radius);} }
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .modal-head h3{margin:0; font-size:15.5px; font-weight:700;}
  .modal-head button{border:none;background:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}
  .modal-actions{display:flex; gap:8px; margin-top:6px;}
  .modal-actions .btn{flex:1;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:20px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  .toast.show{opacity:1;}
  .fab-row{display:flex; justify-content:flex-end; margin-bottom:12px;}
  .helper{font-size:12px; color:var(--ink-soft); margin-top:6px;}

  /* ---------- Choix cliquables (chips) ---------- */
  .chip-group{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:4px;}
  .chip{padding:7px 12px; border-radius:20px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); font-size:12.5px; font-weight:600; cursor:pointer;}
  .chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .chip:hover{filter:brightness(0.97);}

  /* ---------- Photo produit ---------- */
  .photo-upload{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .photo-upload .preview{width:64px; height:64px; border-radius:8px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; background:#fbfcfb; flex-shrink:0; font-size:22px;}
  .photo-upload .preview img{width:100%; height:100%; object-fit:cover;}
  .photo-upload label.pick{font-size:12.5px; color:var(--green); cursor:pointer; text-decoration:underline;}
  .prod-thumb{width:36px; height:36px; border-radius:6px; object-fit:cover; border:1px solid var(--line); vertical-align:middle; display:block;}
  .prod-thumb-empty{width:36px; height:36px; border-radius:6px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--ink-soft);}

  /* ---------- Statut paiement Mobile Money ---------- */
  .momo-status{padding:12px 14px; border-radius:var(--radius); font-size:13.5px; font-weight:700; margin-bottom:12px;}
  .momo-status.pending{background:var(--amber-soft); color:var(--amber);}
  .momo-status.success{background:var(--green-soft); color:var(--green);}
  .momo-status.failed{background:var(--red-soft); color:var(--red);}
  .momo-receipt{background:#fbfcfb; border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; font-size:13px; margin-bottom:12px;}
  .momo-receipt .row{padding:3px 0; display:flex; justify-content:space-between; gap:10px;}
  .momo-receipt .row span:first-child{color:var(--ink-soft);}

  /* ---------- Impression facture ---------- */
  #invoice-print-area{ display:none; }
  @media print{
    body.printing-invoice > *:not(#invoice-print-area){ display:none !important; }
    body.printing-invoice #invoice-print-area{ display:block !important; }
  }
</style>
</head>
<body>

<div id="login-screen"></div>

<div id="app-screen">
  <div class="topbar" id="topbar"></div>
  <div class="tabs" id="tabs"></div>
  <main id="main"></main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-body"></div>
</div>
<div class="toast" id="toast"></div>
<div id="invoice-print-area"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* ============================================================
   STATE
============================================================ */
let CFG = null;       // {auth:{email,password}, companyName, currency, logo, categories, paymentModes, seuilDefaut, entrepots}
let PRODUCTS = [];
let JOURNAL = [];
let SUPPLIERS = [];
let LOCATIONS = [];
let MOVEMENTS = [];
let INVOICES = [];
let MOMO_PAYMENTS = []; // historique des paiements Mobile Money envoyés (Airtel/Orange/MVola)
let PERSONAL = null;  // {displayName,email,password,avatar,notes:[]} — données du compte Personnel
let loggedIn = false;
let activeTab = 'dashboard';
let authMode = 'landing'; // landing | login | register

// ---- Multi-comptes ----
let ACCOUNTS = [];          // registre global: [{id,type,email,password,displayName,createdAt}]
let CURRENT_ACCOUNT = null; // compte actif (élément de ACCOUNTS)
let regType = 'stock';      // type choisi sur le formulaire de création de compte: 'stock' | 'personal'

const TABS = [
  {id:'dashboard', label:'Tableau de bord'},
  {id:'search', label:'🔎 Recherche'},
  {id:'journal', label:'Journal de compte'},
  {id:'momo', label:'💸 Mobile Money'},
  {id:'invoices', label:'Factures'},
  {id:'products', label:'Produits'},
  {id:'stockin', label:'Entrée stock'},
  {id:'stockout', label:'Sortie stock'},
  {id:'alerts', label:'Alertes'},
  {id:'suppliers', label:'Fournisseurs'},
  {id:'locations', label:'Emplacements'},
  {id:'movements', label:'Mouvements'},
  {id:'reports', label:'Rapports'},
  {id:'settings', label:'Paramètres'},
];

const PERSONAL_TABS = [
  {id:'phome', label:'Accueil'},
  {id:'pjournal', label:'Journal'},
  {id:'pnotes', label:'Mes notes'},
  {id:'psettings', label:'Paramètres'},
];
const PERSONAL_DEFAULT_CATEGORIES = ['Alimentation','Transport','Logement','Santé','Éducation','Salaire','Commerce','Loisirs','Autre'];
const PERSONAL_DEFAULT_MODES = ['Espèces','Mobile Money','Virement bancaire','Carte bancaire','Crédit / À payer','Autre'];
/* Moyens de paiement Mobile Money de Madagascar à garantir dans le compte Gestion de Stock */
const STOCK_MG_PAYMENT_MODES = ['Espèces','Airtel Money','Orange Money','MVola','Virement bancaire','Carte bancaire','Crédit / À payer','Autre'];
const STOCK_DEFAULT_CATEGORIES = ['Vente','Achat','Dépense','Autre'];
/* Réseaux Mobile Money proposés pour l'envoi d'un paiement au bénéficiaire (par numéro, jamais par lien/URL) */
const MOMO_NETWORKS = ['Airtel Money','Orange Money','MVola'];
const MOMO_PHONE_HINTS = {'Airtel Money':'033 xx xxx xx','Orange Money':'032/037 xx xxx xx','MVola':'034/038 xx xxx xx'};
function ensurePersonalDefaults(){
  if(!PERSONAL) return;
  if(!Array.isArray(PERSONAL.journal)) PERSONAL.journal = [];
  if(!Array.isArray(PERSONAL.categories) || !PERSONAL.categories.length) PERSONAL.categories = [...PERSONAL_DEFAULT_CATEGORIES];
  if(!Array.isArray(PERSONAL.paymentModes) || !PERSONAL.paymentModes.length) PERSONAL.paymentModes = [...PERSONAL_DEFAULT_MODES];
  if(typeof PERSONAL.soldeInitial !== 'number') PERSONAL.soldeInitial = 0;
  personalRecomputeSoldes();
}
function ensureStockCfgDefaults(){
  if(!CFG) return;
  if(!Array.isArray(CFG.paymentModes)) CFG.paymentModes = [];
  STOCK_MG_PAYMENT_MODES.forEach(m=>{ if(!CFG.paymentModes.includes(m)) CFG.paymentModes.push(m); });
  if(!Array.isArray(CFG.categories)) CFG.categories = [];
  STOCK_DEFAULT_CATEGORIES.forEach(c=>{ if(!CFG.categories.includes(c)) CFG.categories.push(c); });
  /* Paramètre technique uniquement : URL du backend qui appelle l'API officielle du réseau.
     Ne doit jamais être saisie ni affichée dans le formulaire de paiement (champ bénéficiaire = numéro, pas un lien). */
  if(typeof CFG.momoBackendUrl !== 'string') CFG.momoBackendUrl = '';
  if(!Array.isArray(MOMO_PAYMENTS)) MOMO_PAYMENTS = [];
}
function currentTabs(){ return (CURRENT_ACCOUNT && CURRENT_ACCOUNT.type==='personal') ? PERSONAL_TABS : TABS; }

/* ============================================================
   STORAGE HELPERS
============================================================ */
async function loadAll(){
  const keys = ['config','products','journal','suppliers','locations','movements'];
  const results = await Promise.all(keys.map(k => safeGet(k)));
  CFG = results[0] ? JSON.parse(results[0].value) : null;
  PRODUCTS = results[1] ? JSON.parse(results[1].value) : [];
  JOURNAL = results[2] ? JSON.parse(results[2].value) : [];
  SUPPLIERS = results[3] ? JSON.parse(results[3].value) : [];
  LOCATIONS = results[4] ? JSON.parse(results[4].value) : [];
  MOVEMENTS = results[5] ? JSON.parse(results[5].value) : [];
}
const hasCloudStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';

async function storeGet(key){
  if(hasCloudStorage){
    try{ return await window.storage.get(key, false); }catch(e){ return null; }
  }
  try{
    const v = window.localStorage.getItem('gsj_'+key);
    return v!==null ? {key, value:v, shared:false} : null;
  }catch(e){ return null; }
}
async function storeSet(key, value){
  if(hasCloudStorage){
    try{ return await window.storage.set(key, value, false); }catch(e){ return null; }
  }
  try{ window.localStorage.setItem('gsj_'+key, value); return {key, value, shared:false}; }catch(e){ return null; }
}
async function safeGet(key){ return await storeGet(key); }

/* ---- Stockage isolé par compte ----
   Chaque compte (Personnel ou Gestion de Stock) a son propre espace de clés,
   préfixé par son identifiant unique, afin qu'aucune donnée ni historique
   ne puisse se mélanger entre deux comptes. */
function acctKey(key){ return 'acct_'+(CURRENT_ACCOUNT ? CURRENT_ACCOUNT.id : 'none')+'_'+key; }
async function acctGet(key){ return await storeGet(acctKey(key)); }
async function acctSet(key, value){ return await storeSet(acctKey(key), value); }

async function saveCfg(){ await acctSet('config', JSON.stringify(CFG)); }
async function saveProducts(){ await acctSet('products', JSON.stringify(PRODUCTS)); }
async function saveJournal(){ await acctSet('journal', JSON.stringify(JOURNAL)); }
async function saveSuppliers(){ await acctSet('suppliers', JSON.stringify(SUPPLIERS)); }
async function saveLocations(){ await acctSet('locations', JSON.stringify(LOCATIONS)); }
async function saveMovements(){ await acctSet('movements', JSON.stringify(MOVEMENTS)); }
async function saveInvoices(){ await acctSet('invoices', JSON.stringify(INVOICES)); }
async function saveMomoPayments(){ await acctSet('momoPayments', JSON.stringify(MOMO_PAYMENTS)); }
async function savePersonal(){ await acctSet('personal', JSON.stringify(PERSONAL)); }

/* ---- Registre global des comptes (jamais namespacé — c'est lui qui référence les comptes) ---- */
async function loadAccountsIndex(){
  const r = await storeGet('accounts_index');
  ACCOUNTS = r ? JSON.parse(r.value) : [];
  // Migration douce : si un ancien compte (avant la gestion multi-comptes) existe
  // sous les anciennes clés non namespacées, on le convertit en compte
  // "Gestion de Stock" sans rien perdre de ses données.
  if(ACCOUNTS.length===0){
    const legacyCfg = await storeGet('config');
    if(legacyCfg){
      try{
        const cfgObj = JSON.parse(legacyCfg.value);
        const legacyId = 'legacy-'+uid();
        const acct = {
          id: legacyId, type:'stock',
          email: (cfgObj.auth && cfgObj.auth.email) || '',
          password: (cfgObj.auth && cfgObj.auth.password) || '',
          displayName: cfgObj.companyName || 'Mon entreprise',
          createdAt: Date.now(),
        };
        ACCOUNTS.push(acct);
        await storeSet('accounts_index', JSON.stringify(ACCOUNTS));
        const legacyKeys = ['config','products','journal','suppliers','locations','movements'];
        for(const k of legacyKeys){
          const v = await storeGet(k);
          if(v) await storeSet('acct_'+legacyId+'_'+k, v.value);
        }
      }catch(e){ console.error('Migration compte existant impossible', e); }
    }
  }
}
async function saveAccountsIndex(){ await storeSet('accounts_index', JSON.stringify(ACCOUNTS)); }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============================================================
   UTIL
============================================================ */
function fmtMoney(n){
  n = Number(n)||0;
  return n.toLocaleString('fr-FR',{maximumFractionDigits:0}).replace(/,/g,' ') + ' ' + (CFG?.currency || 'Ar');
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('fr-FR');
}
function fmtDateTime(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('fr-FR') + ' ' + dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function today(){ return new Date().toISOString().slice(0,10); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   CHOIX CLIQUABLES (chips) — remplace les listes déroulantes/saisie libre
   pour les champs à choix prédéfinis. Le hidden input garde le même id
   que l'ancien <select>, donc tout le code existant qui lit .value
   continue de fonctionner sans changement.
============================================================ */
function chipGroupHtml(id, options, selected){
  const sel = selected || options[0] || '';
  return `<div class="chip-group" data-chip-group="${id}">
    ${options.map(o=>`<button type="button" class="chip ${o===sel?'active':''}" data-chip-value="${esc(o)}">${esc(o)}</button>`).join('')}
  </div><input type="hidden" id="${id}" value="${esc(sel)}">`;
}
function bindChipGroup(id){
  const group = document.querySelector(`[data-chip-group="${id}"]`);
  const hidden = document.getElementById(id);
  if(!group || !hidden) return;
  group.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      group.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      hidden.value = btn.dataset.chipValue;
      hidden.dispatchEvent(new Event('change'));
    });
  });
}
/* Un choix est protégé (non supprimable) s'il fait partie des valeurs par défaut de l'application */
function isProtectedChoice(value, list){ return list.includes(value); }
function tagListHtml(values, protectedList, dataAttr){
  return values.map(v=>{
    const locked = isProtectedChoice(v, protectedList);
    return `<span class="tag">${esc(v)}${locked?'':`<button data-${dataAttr}="${esc(v)}">✕</button>`}</span>`;
  }).join('');
}

let pendingLogo = null;
function handleLogoPick(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    pendingLogo = reader.result;
    const prev = document.getElementById('logo-preview');

  reader.readAsDataURL(file);

async function doRegister(){
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  if(!email || !password){ renderLogin('Veuillez remplir l\'email et le mot de passe.'); return; }
  if(ACCOUNTS.some(a=>a.email.toLowerCase()===email.toLowerCase())){
    renderLogin('Un compte existe déjà avec cet email.');
    return;
  }

  const id = 'acc-'+uid();
  if(regType==='stock'){
    const company = document.getElementById('reg-company').value.trim();
    const currency = document.getElementById('reg-currency').value;
    const account = {id, type:'stock', email, password, displayName: company || 'Mon entreprise', createdAt: Date.now()};
    ACCOUNTS.push(account);
    await saveAccountsIndex();
    CURRENT_ACCOUNT = account;
    CFG = {
      auth:{email, password},
      companyName: company || 'Mon entreprise',
      currency: currency,
      logo: pendingLogo || null,
      address: '',
      phone: '',
      email: email,
      categories: [...STOCK_DEFAULT_CATEGORIES],
      paymentModes: [...STOCK_MG_PAYMENT_MODES],
      seuilDefaut: 5,
      soldeInitial: 0,
      entrepots: ['Entrepôt A'],
      momoBackendUrl: '', // paramètre technique uniquement — jamais saisi via le champ bénéficiaire
    };
    PRODUCTS = []; JOURNAL = []; SUPPLIERS = []; LOCATIONS = []; MOVEMENTS = []; INVOICES = []; MOMO_PAYMENTS = [];
    await Promise.all([saveCfg(),saveProducts(),saveJournal(),saveSuppliers(),saveLocations(),saveMovements(),saveInvoices(),saveMomoPayments()]);
  } else {
    const name = document.getElementById('reg-name').value.trim();
    const account = {id, type:'personal', email, password, displayName: name || 'Mon espace', createdAt: Date.now()};
    ACCOUNTS.push(account);
    await saveAccountsIndex();
    CURRENT_ACCOUNT = account;
    PERSONAL = {displayName: name || 'Mon espace', email, password, avatar:null, notes:[]};
    await savePersonal();
  }
  pendingLogo = null;
  loggedIn = true;
  boot();
}
async function doLogin(){
  const email = document.getElementById('log-email').value.trim();
  const password = document.getElementById('log-password').value;
  const account = ACCOUNTS.find(a=>a.email.toLowerCase()===email.toLowerCase() && a.password===password);
  if(!account){ renderLogin('Email ou mot de passe incorrect.'); return; }
  CURRENT_ACCOUNT = account;
  if(account.type==='stock'){
    const r = await acctGet('config');
    CFG = r ? JSON.parse(r.value) : null;
    const results = await Promise.all(['products','journal','suppliers','locations','movements','invoices','momoPayments'].map(k=>acctGet(k)));
    PRODUCTS = results[0] ? JSON.parse(results[0].value) : [];
    JOURNAL = results[1] ? JSON.parse(results[1].value) : [];
    SUPPLIERS = results[2] ? JSON.parse(results[2].value) : [];
    LOCATIONS = results[3] ? JSON.parse(results[3].value) : [];
    MOVEMENTS = results[4] ? JSON.parse(results[4].value) : [];
    INVOICES = results[5] ? JSON.parse(results[5].value) : [];
    MOMO_PAYMENTS = results[6] ? JSON.parse(results[6].value) : [];
  } else {
    const r = await acctGet('personal');
    PERSONAL = r ? JSON.parse(r.value) : {displayName:account.displayName, email:account.email, password:account.password, avatar:null, notes:[]};
  }
  loggedIn = true;
  boot();
}

  el.innerHTML = tabs.map(t=>`<button class="tab-btn ${t.id===activeTab?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');

function renderAll(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="section active" id="section-content"></div>`;
  const c = document.getElementById('section-content');
  if(CURRENT_ACCOUNT) refreshSuggestionLists();
  if(CURRENT_ACCOUNT.type==='personal'){
    switch(activeTab){
      case 'phome': c.innerHTML = viewPersonalHome(); break;
      case 'pjournal': c.innerHTML = viewPersonalJournal(); afterPersonalJournal(); break;
      case 'pnotes': c.innerHTML = viewPersonalNotes(); afterPersonalNotes(); break;
      case 'psettings': c.innerHTML = viewPersonalSettings(); afterPersonalSettings(); break;
    }
    return;
  }
  switch(activeTab){
    case 'dashboard': c.innerHTML = viewDashboard(); afterDashboard(); break;

    case 'journal': c.innerHTML = viewJournal(); afterJournal(); break;

    case 'locations': c.innerHTML = viewLocations(); afterLocations(); break;
    case 'movements': c.innerHTML = viewMovements(); break;

}

/* ============================================================
   JOURNAL DE COMPTE PERSONNEL
============================================================ */
function personalNextOpNumber(){ return 'OPP-' + String(PERSONAL.journal.length+1).padStart(4,'0'); }
function personalRecomputeSoldes(){
  if(!PERSONAL || !Array.isArray(PERSONAL.journal)) return;
  let bal = Number(PERSONAL.soldeInitial||0);
  PERSONAL.journal.forEach(j=>{
    bal = j.type==='Recette' ? bal + Number(j.montant||0) : bal - Number(j.montant||0);
    j.solde = bal;
  });
}
function filteredPersonalJournal(){
  const date = document.getElementById('pf-date')?.value || '';
  const month = document.getElementById('pf-month')?.value || '';
  const cat = document.getElementById('pf-cat')?.value || '';
  const mode = document.getElementById('pf-mode')?.value || '';
  const type = document.getElementById('pf-type')?.value || '';
  return PERSONAL.journal.filter(j=>{
    if(date && j.date!==date) return false;
    if(month && !(j.date||'').startsWith(month)) return false;
    if(cat && j.categorie!==cat) return false;
    if(mode && j.paiement!==mode) return false;
    if(type && j.type!==type) return false;
    return true;
  });
}
function personalGroupTotals(rows){
  const byDay = {}, byMonth = {};
  rows.forEach(j=>{
    const day = j.date || '—';
    const month = (j.date||'').slice(0,7) || '—';
    if(!byDay[day]) byDay[day] = {in:0,out:0};
    if(!byMonth[month]) byMonth[month] = {in:0,out:0};
    if(j.type==='Recette'){ byDay[day].in += Number(j.montant||0); byMonth[month].in += Number(j.montant||0); }
    else { byDay[day].out += Number(j.montant||0); byMonth[month].out += Number(j.montant||0); }
  });
  return {byDay, byMonth};
}
function viewPersonalJournal(){
  const cats = PERSONAL.categories, modes = PERSONAL.paymentModes;
  const rows = filteredPersonalJournal();
  const rowsDesc = [...rows].reverse();
  const totalIn = rows.filter(j=>j.type==='Recette').reduce((s,j)=>s+Number(j.montant||0),0);

          <tbody>
          ${rowsDesc.length ? rowsDesc.map(j=>`
            <tr>

          </tbody>
        </table>
      </div>
    </div>

    <div class="panel"><h3>Total par jour</h3>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Date</th><th>Recettes</th><th>Dépenses</th></tr></thead>
        <tbody>${dayKeys.length ? dayKeys.map(d=>`<tr><td>${fmtDate(d)}</td><td class="num">${fmtMoney(byDay[d].in)}</td><td class="num">${fmtMoney(byDay[d].out)}</td></tr>`).join('') : `<tr><td colspan="3" class="empty">Aucune donnée</td></tr>`}</tbody>

      <div class="tbl-wrap"><table>
        <thead><tr><th>Mois</th><th>Recettes</th><th>Dépenses</th></tr></thead>
        <tbody>${monthKeys.length ? monthKeys.map(m=>`<tr><td>${esc(m)}</td><td class="num">${fmtMoney(byMonth[m].in)}</td><td class="num">${fmtMoney(byMonth[m].out)}</td></tr>`).join('') : `<tr><td colspan="3" class="empty">Aucune donnée</td></tr>`}</tbody>

function openPersonalJournalModal(){

      id: uid(),
      numero: personalNextOpNumber(),
      date: document.getElementById('pj-date').value || today(),
      libelle,
      categorie: document.getElementById('pj-cat').value,
      type: document.getElementById('pj-type').value,

      paiement: document.getElementById('pj-mode').value,

      observation: document.getElementById('pj-obs').value.trim(),

    personalRecomputeSoldes();
    await savePersonal();
    closeModal();
    renderAll();
    showToast('Opération enregistrée');
  });
}

function viewSearch(){
  return `
    <h2 class="title">🔎 Recherche</h2>
    <p class="subtitle">Rechercher un produit, une référence, un client, un fournisseur, une opération...</p>
    <div class="panel">
      <div class="field"><input id="search-term" placeholder="Tapez un nom, un code, une référence..."></div>
      <div class="filters">
        <input type="date" id="search-date" title="Filtrer par date">
        <select id="search-cat"><option value="">Toutes catégories</option>${CFG.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
        <select id="search-type"><option value="">Tous types</option><option>Entrée</option><option>Sortie</option></select>
        <select id="search-mode"><option value="">Tous modes de paiement</option>${CFG.paymentModes.map(m=>`<option>${esc(m)}</option>`).join('')}</select>
        <button class="btn btn-outline btn-sm" id="search-reset">Réinitialiser</button>
      </div>
    </div>
    <div id="search-results"></div>
  `;
}
function afterSearch(){
  const ids = ['search-term','search-date','search-cat','search-type','search-mode'];
  const update = ()=>{ document.getElementById('search-results').innerHTML = renderSearchResults(); };
  ids.forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener('input', update);
    el.addEventListener('change', update);
  });
  document.getElementById('search-reset').addEventListener('click', ()=>{
    ids.forEach(id=>{ document.getElementById(id).value=''; });
    update();
  });
  update();
}
function renderSearchResults(){
  const term = (document.getElementById('search-term').value||'').trim().toLowerCase();
  const date = document.getElementById('search-date').value;
  const cat = document.getElementById('search-cat').value;
  const type = document.getElementById('search-type').value;
  const mode = document.getElementById('search-mode').value;
  const match = (s)=> !term || String(s||'').toLowerCase().includes(term);
  const hasAny = term || date || cat || type || mode;
  if(!hasAny) return `<div class="panel"><p class="helper">Tapez un mot-clé ou choisissez un filtre pour lancer la recherche.</p></div>`;

  const products = PRODUCTS.filter(p=> (!cat||p.category===cat) && (match(p.name)||match(p.code)||match(p.category)||match(p.supplier)||match(p.location)) );
  const suppliers = SUPPLIERS.filter(s=> match(s.name)||match(s.phone)||match(s.email)||match(s.products));
  const journalRows = JOURNAL.filter(j=>{
    if(date && j.date!==date) return false;
    if(cat && j.categorie!==cat) return false;
    if(type && j.type!==type) return false;
    if(mode && j.paiement!==mode) return false;
    return !term || match(j.libelle)||match(j.tiers)||match(j.reference)||match(j.categorie)||match(j.paiement);
  });
  const movements = MOVEMENTS.filter(m=>{
    if(date && m.date!==date) return false;
    if(type && m.type!==type) return false;
    return !term || match(m.product)||match(m.motif)||match(m.reference);
  });
  const invoices = INVOICES.filter(inv=> match(inv.numero) || match(inv.client && inv.client.name) );
  const payments = MOMO_PAYMENTS.filter(p=>{
    if(date && (p.date||'').slice(0,10)!==date) return false;
    if(mode && p.network!==mode) return false;
    return !term || match(p.beneficiaire)||match(p.phone)||match(p.sender)||match(p.reference)||match(p.transactionId)||match(p.network);
  });

  const section = (title, rows, cols, renderRow)=> `
    <div class="panel"><h3>${title} (${rows.length})</h3>
      ${rows.length? `<div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(renderRow).join('')}</tbody></table></div>` : `<div class="empty">Aucun résultat</div>`}
    </div>`;

  return [
    section('📦 Produits', products, ['Code','Nom','Catégorie','Qté','Fournisseur'],
      p=>`<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td class="num">${p.quantity}</td><td>${esc(p.supplier)}</td></tr>`),
    section('🚚 Fournisseurs', suppliers, ['Nom','Téléphone','Email'],
      s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td>${esc(s.email)}</td></tr>`),
    section('📒 Journal de compte', journalRows, ['Date','Libellé','Catégorie','Type','Montant','Paiement','Tiers'],
      j=>`<tr><td>${fmtDate(j.date)}</td><td>${esc(j.libelle)}</td><td>${esc(j.categorie)}</td><td>${j.type}</td><td class="num">${fmtMoney(j.montant)}</td><td>${esc(j.paiement)}</td><td>${esc(j.tiers)}</td></tr>`),
    section('🔄 Mouvements de stock', movements, ['Date','Produit','Type','Qté','Référence'],
      m=>`<tr><td>${fmtDate(m.date)}</td><td>${esc(m.product)}</td><td>${m.type}</td><td class="num">${m.quantity}</td><td>${esc(m.reference)}</td></tr>`),
    section('🧾 Factures', invoices, ['N°','Client','Total'],
      inv=>`<tr><td>${esc(inv.numero)}</td><td>${esc(inv.client&&inv.client.name)}</td><td class="num">${fmtMoney(inv.total||0)}</td></tr>`),
    section('💸 Paiements Mobile Money', payments, ['Date','Réseau','Destinataire','Numéro','Montant','Statut'],
      p=>`<tr><td>${fmtDateTime(p.date)}</td><td>${esc(p.network)}</td><td>${esc(p.beneficiaire)}</td><td class="num">${esc(p.phone)}</td><td class="num">${fmtMoney(p.montant)}</td><td>${esc(p.statut)}</td></tr>`),
  ].join('');
}

function viewDashboard(){
  const nbProduits = PRODUCTS.length;

  const stockEpuise = PRODUCTS.filter(p=>Number(p.quantity)<=0);
  const valeurStock = PRODUCTS.reduce((s,p)=>s+Number(p.quantity||0)*Number(p.buyPrice||0),0);
  const totalEntreesMvt = MOVEMENTS.filter(m=>m.type==='Entrée').reduce((s,m)=>s+Number(m.quantity||0),0);
  const totalSortiesMvt = MOVEMENTS.filter(m=>m.type==='Sortie').reduce((s,m)=>s+Number(m.quantity||0),0);
  const totalEntreesJournal = JOURNAL.filter(j=>j.type==='Entrée').reduce((s,j)=>s+Number(j.montant||0),0);
  const totalSortiesJournal = JOURNAL.filter(j=>j.type==='Sortie').reduce((s,j)=>s+Number(j.montant||0),0);
  const soldeActuel = JOURNAL.length ? JOURNAL[JOURNAL.length-1].solde : Number(CFG.soldeInitial||0);

  return `

    <div class="panel"><h3>Stock</h3>

        <div class="kpi"><div class="lbl">Quantité totale en stock</div><div class="val num">${qteTotale}</div></div>
        <div class="kpi ${stockFaible.length?'amber':''}"><div class="lbl">Stock faible ⚠️</div><div class="val num">${stockFaible.length}</div></div>
        <div class="kpi ${stockEpuise.length?'alert':''}"><div class="lbl">Stock épuisé ❌</div><div class="val num">${stockEpuise.length}</div></div>

        <div class="kpi ok"><div class="lbl">Entrées (cumul)</div><div class="val num">${totalEntreesMvt}</div></div>
        <div class="kpi alert"><div class="lbl">Sorties (cumul)</div><div class="val num">${totalSortiesMvt}</div></div>
      </div>
    </div>

        <div class="kpi ok"><div class="lbl">Total entrées (Ar)</div><div class="val num">${fmtMoney(totalEntreesJournal)}</div></div>
        <div class="kpi alert"><div class="lbl">Total sorties (Ar)</div><div class="val num">${fmtMoney(totalSortiesJournal)}</div></div>
        <div class="kpi"><div class="lbl">Solde actuel</div><div class="val num">${fmtMoney(soldeActuel)}</div></div>
      </div>
    </div>
  `;
}

============================================================ */
function nextOpNumber(){
  return 'OP-' + String(JOURNAL.length+1).padStart(4,'0');
}
function recomputeSoldes(){
  let bal = Number(CFG.soldeInitial||0);
  JOURNAL.forEach(j=>{
    bal = j.type==='Entrée' ? bal + Number(j.montant||0) : bal - Number(j.montant||0);
    j.solde = bal;
  });
}
function viewJournal(){
  const cats = CFG.categories;
  const modes = CFG.paymentModes;
  const rows = filteredJournal();
  const totalIn = rows.filter(j=>j.type==='Entrée').reduce((s,j)=>s+Number(j.montant),0);
  const totalOut = rows.filter(j=>j.type==='Sortie').reduce((s,j)=>s+Number(j.montant),0);
  return `

    <p class="subtitle">Historique des opérations financières</p>

    <div class="cards">
      <div class="kpi ok"><div class="lbl">Total entrées</div><div class="val num">${fmtMoney(totalIn)}</div></div>
      <div class="kpi alert"><div class="lbl">Total sorties</div><div class="val num">${fmtMoney(totalOut)}</div></div>
      <div class="kpi"><div class="lbl">Solde actuel</div><div class="val num">${fmtMoney(JOURNAL.length?JOURNAL[JOURNAL.length-1].solde:(CFG.soldeInitial||0))}</div></div>

        <input type="month" id="f-month">
        <select id="f-cat"><option value="">Toutes catégories</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
        <select id="f-mode"><option value="">Tous modes</option>${modes.map(m=>`<option>${esc(m)}</option>`).join('')}</select>
        <select id="f-type"><option value="">Entrée/Sortie</option><option>Entrée</option><option>Sortie</option></select>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>N°</th><th>Date</th><th>Libellé</th><th>Catégorie</th><th>Type</th><th>Montant</th><th>Paiement</th><th>Client/Fourn.</th><th>Solde</th><th></th></tr></thead>
          <tbody>
          ${rows.length ? rows.map(j=>`
            <tr>
              <td>${esc(j.numero)}</td>
              <td>${fmtDate(j.date)}</td>
              <td>${esc(j.libelle)}</td>
              <td>${esc(j.categorie)}</td>
              <td><span class="badge ${j.type==='Entrée'?'badge-in':'badge-out'}">${j.type}</span></td>

              <td><div class="row-actions">
                <button class="icon-btn" data-del-journal="${j.id}" title="Supprimer">🗑️</button>
              </div></td>
            </tr>`).join('') : `<tr><td colspan="10" class="empty">Aucune opération enregistrée</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
function filteredJournal(){
  const month = document.getElementById('f-month')?.value || '';
  const cat = document.getElementById('f-cat')?.value || '';
  const mode = document.getElementById('f-mode')?.value || '';
  const type = document.getElementById('f-type')?.value || '';
  return JOURNAL.filter(j=>{
    if(month && !(j.date||'').startsWith(month)) return false;
    if(cat && j.categorie!==cat) return false;
    if(mode && j.paiement!==mode) return false;
    if(type && j.type!==type) return false;
    return true;
  });
}

      await saveJournal();

      showToast('Opération supprimée');
    });
  });
}

function afterMomoPayment(){
  bindChipGroup('momo-network');
  const networkHidden = document.getElementById('momo-network');
  const hint = document.getElementById('momo-phone-hint');
  const updateHint = ()=>{ hint.textContent = 'Format attendu : '+(MOMO_PHONE_HINTS[networkHidden.value]||''); };
  networkHidden.addEventListener('change', updateHint);
  updateHint();

  const statusZone = document.getElementById('momo-status-zone');
  if(momoLastResult) statusZone.innerHTML = momoReceiptHtml(momoLastResult);

  document.getElementById('momo-send').addEventListener('click', async ()=>{
    const network = networkHidden.value;
    const sender = document.getElementById('momo-sender').value.trim().replace(/[\s.-]/g,'');
    const phone = document.getElementById('momo-phone').value.trim().replace(/[\s.-]/g,'');
    const beneficiaire = document.getElementById('momo-name').value.trim();
    const montant = Number(document.getElementById('momo-amount').value);
    const motif = document.getElementById('momo-motif').value.trim();
    const reference = document.getElementById('momo-ref').value.trim();
    const alsoJournal = document.getElementById('momo-journal').checked;

    if(!/^\d{9,10}$/.test(sender)){ showToast("Numéro de l'expéditeur invalide"); return; }
    if(!/^\d{9,10}$/.test(phone)){ showToast('Numéro du destinataire invalide'); return; }
    if(!beneficiaire){ showToast('Le nom du destinataire est requis'); return; }
    if(!montant || montant<=0){ showToast('Montant invalide'); return; }

    const payment = {
      id: uid(), date: new Date().toISOString(), network, sender, phone, beneficiaire, montant, motif, reference,
      statut: 'En cours', transactionId: '', errorMessage: '',
    };
    MOMO_PAYMENTS.push(payment);
    await saveMomoPayments();
    momoLastResult = payment;
    statusZone.innerHTML = `<div class="momo-status pending">⏳ Paiement en cours… transmission au réseau ${esc(network)}</div>`;

    await executeMomoPayment(payment);
    momoLastResult = payment;
    statusZone.innerHTML = momoReceiptHtml(payment);

    if(alsoJournal && payment.statut==='Réussi'){
      await addJournalEntry({
        libelle: `Paiement ${network} — ${beneficiaire}`,
        categorie: CFG.categories.includes('Dépense') ? 'Dépense' : CFG.categories[0],
        type: 'Sortie',
        montant, paiement: network, tiers: beneficiaire,
        reference: payment.transactionId || reference || payment.id, observation: motif,
      });
    }
    document.getElementById('section-content').innerHTML = viewMomoPayment();
    afterMomoPayment();
  });

  document.querySelectorAll('[data-del-momo]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      if(!confirm('Supprimer cet enregistrement de paiement ?')) return;
      MOMO_PAYMENTS = MOMO_PAYMENTS.filter(p=>p.id!==b.dataset.delMomo);
      await saveMomoPayments();
      if(momoLastResult && momoLastResult.id===b.dataset.delMomo) momoLastResult = null;
      renderAll();
    });
  });
}
/* Envoie le paiement au backend sécurisé, qui seul détient les clés API des opérateurs
   et appelle leur API officielle. Le statut n'est JAMAIS mis à "Réussi" sans confirmation
   explicite du backend (payload {status:"success", transactionId:...}). Toute ambiguïté,
   erreur réseau, ou absence de backend est traitée comme un échec — jamais comme un succès. */
async function executeMomoPayment(payment){
  const backendUrl = (CFG.momoBackendUrl||'').trim();
  if(!backendUrl){
    payment.statut = 'Échoué';
    payment.errorMessage = "Aucun backend de paiement configuré (Paramètres → Paramètres techniques)";
    await saveMomoPayments();
    showToast('Paiement échoué : backend non configuré');
    return;
  }
  try{
    const res = await fetch(backendUrl, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        network: payment.network,
        senderPhone: payment.sender,
        beneficiaryPhone: payment.phone,
        beneficiaryName: payment.beneficiaire,
        amount: payment.montant,
        motif: payment.motif,
        reference: payment.reference,
      }),
    });
    let body = null;
    try{ body = await res.json(); }catch(e){ body = null; }
    if(res.ok && body && body.status==='success'){
      payment.statut = 'Réussi';
      payment.transactionId = body.transactionId || body.reference || '';
      showToast('Paiement réussi');
    } else {
      payment.statut = 'Échoué';
      payment.errorMessage = (body && (body.message||body.error)) || `Réponse du backend non confirmée (HTTP ${res.status})`;
      showToast('Paiement échoué');
    }
  }catch(e){
    payment.statut = 'Échoué';
    payment.errorMessage = 'Impossible de contacter le backend de paiement';
    showToast('Paiement échoué : connexion au backend impossible');
  }
  await saveMomoPayments();
}

function nextInvoiceNumber(){
  return 'FAC-' + String(INVOICES.length+1).padStart(4,'0');
}
function invoiceTotals(draft){
  const subtotal = draft.items.reduce((s,it)=>s+Number(it.qty||0)*Number(it.unitPrice||0),0);
  let discountAmount = draft.discountType==='percent'
    ? subtotal*(Number(draft.discountValue)||0)/100
    : (Number(draft.discountValue)||0);
  discountAmount = Math.min(Math.max(discountAmount,0), subtotal);
  const afterDiscount = subtotal - discountAmount;
  const tvaAmount = afterDiscount * (Number(draft.tvaPercent)||0)/100;
  const total = afterDiscount + tvaAmount;
  return {subtotal, discountAmount, tvaAmount, total};
}

/* Recharge jsPDF / html2canvas si elles n'ont pas pu se charger au démarrage
   de la page (ex: pas de connexion internet au premier chargement). */
function ensurePdfLibsLoaded(){
  return new Promise((resolve, reject)=>{
    const jspdfOk = ()=> typeof window.jspdf !== 'undefined';
    const h2cOk = ()=> typeof window.html2canvas !== 'undefined';
    if(jspdfOk() && h2cOk()){ resolve(); return; }
    let pending = 0;
    const checkDone = ()=>{ pending--; if(pending<=0){
      if(jspdfOk() && h2cOk()) resolve();
      else reject(new Error('Librairies PDF indisponibles — une connexion internet est nécessaire pour les charger la première fois.'));
    }};
    const loadScript = (src, okCheck)=>{
      if(okCheck()) return;
      pending++;
      const s = document.createElement('script');
      s.src = src;
      s.onload = checkDone;
      s.onerror = checkDone;
      document.head.appendChild(s);
    };
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', jspdfOk);
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', h2cOk);
    if(pending===0) checkDone(); // déjà chargées entre-temps
  });
}
/* Génère le PDF de la facture (multi-page si le contenu dépasse une page A4) et retourne un Blob */
async function generateInvoicePdfBlob(inv){
  await ensurePdfLibsLoaded();
  const area = document.getElementById('invoice-print-area');
  area.innerHTML = invoiceDocumentHTML(inv);
  area.style.cssText = 'display:block; position:fixed; left:-9999px; top:0;';
  try{
    const { jsPDF } = window.jspdf;
    const canvas = await window.html2canvas(area.firstElementChild, {scale:2, backgroundColor:'#ffffff', useCORS:true});
    const imgData = canvas.toDataURL('image/png');
    const pdf = new jsPDF({unit:'pt', format:'a4'});
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 20;
    const imgWidth = pageWidth - margin*2;
    const imgHeight = canvas.height * (imgWidth/canvas.width);
    const usableHeight = pageHeight - margin*2;
    let heightLeft = imgHeight;
    let position = margin;
    pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
    heightLeft -= usableHeight;
    while(heightLeft > 0){
      position = margin - (imgHeight - heightLeft);
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
      heightLeft -= usableHeight;
    }
    return pdf.output('blob');
  } finally {
    area.removeAttribute('style');
    area.innerHTML = '';
  }
}
/* Déclenche le téléchargement d'un Blob de façon robuste (lien + secours nouvel onglet) */
function downloadBlobFile(blob, filename){
  const url = URL.createObjectURL(blob);
  try{
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(e){
    window.open(url, '_blank');
  }
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
async function downloadInvoicePDF(inv){
  showToast('Génération du PDF...');
  try{
    const blob = await generateInvoicePdfBlob(inv);
    downloadBlobFile(blob, 'facture-'+inv.numero+'.pdf');
    showToast('PDF téléchargé');
  }catch(e){
    console.error(e);
    showToast('Échec du PDF — vérifiez votre connexion internet, ou utilisez "Imprimer"');
  }
}
async function openInvoicePdfInNewTab(inv){
  showToast('Génération du PDF...');
  try{
    const blob = await generateInvoicePdfBlob(inv);
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){
    console.error(e);
    showToast('Échec du PDF — vérifiez votre connexion internet, ou utilisez "Imprimer"');
  }
}

      type:'Sortie', quantity: qty, stockBefore: before, stockAfter: product.quantity,
      motif: client || 'Vente', user: CFG.auth.email, reference: document.getElementById('so-ref').value.trim(),
      observation: document.getElementById('so-obs').value.trim(), paiement: soMode,
    });
    await saveMovements();

    if(document.getElementById('so-journal').checked){
      await addJournalEntry({
        libelle:`Vente — ${product.name}`, categorie:'Vente', type:'Entrée',
        montant: qty*price, paiement: soMode, tiers: client, reference: document.getElementById('so-ref').value.trim(),
        observation: document.getElementById('so-obs').value.trim(),
      });
    }
    renderAll();
    showToast('Sortie de stock enregistrée');
  });
}

/* ============================================================
   ALERTES
============================================================ */
function viewAlerts(){
  const faible = PRODUCTS.filter(p=>Number(p.quantity)>0 && Number(p.quantity)<=Number(p.threshold||CFG.seuilDefaut));
  const epuise = PRODUCTS.filter(p=>Number(p.quantity)<=0);
  const cutoff = Date.now() - 30*24*3600*1000;
  const lastMoveByProduct = {};
  MOVEMENTS.forEach(m=>{ lastMoveByProduct[m.product] = Math.max(lastMoveByProduct[m.product]||0, new Date(m.date).getTime()||0); });
  const dormant = PRODUCTS.filter(p=>{
    const last = lastMoveByProduct[p.name];
    return !last || last < cutoff;
  });
  const table = (rows,cols)=> rows.length ? `
    <div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(p=>`<tr><td>${esc(p.name)}</td><td class="num">${p.quantity}</td><td class="num">${p.threshold}</td><td>${esc(p.supplier)||'—'}</td></tr>`).join('')}</tbody></table></div>
  ` : `<div class="empty">Rien à signaler</div>`;

  return `
    <h2 class="title">Alertes stock</h2>
    <p class="subtitle">Produits à surveiller</p>
    <div class="panel"><h3>❌ Stock épuisé</h3>${table(epuise,['Produit','Qté','Seuil','Fournisseur'])}</div>
    <div class="panel"><h3>⚠️ Stock faible</h3>${table(faible,['Produit','Qté','Seuil','Fournisseur'])}</div>
    <div class="panel"><h3>⏳ Produits sans mouvement depuis 30 jours</h3>${table(dormant,['Produit','Qté','Seuil','Fournisseur'])}</div>
  `;
}

  `;

function afterReports(){
  document.getElementById('r-apply').addEventListener('click', renderReportOutput);
  renderReportOutput();
}
function renderReportOutput(){
  const from = document.getElementById('r-from').value;
  const to = document.getElementById('r-to').value;
  const inRange = d => (!from || d>=from) && (!to || d<=to);

  const movIn = MOVEMENTS.filter(m=>m.type==='Entrée' && inRange(m.date));
  const movOut = MOVEMENTS.filter(m=>m.type==='Sortie' && inRange(m.date));
  const salesByProduct = {};
  movOut.forEach(m=>{ salesByProduct[m.product] = (salesByProduct[m.product]||0) + Number(m.quantity); });
  const topSold = Object.entries(salesByProduct).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const faible = PRODUCTS.filter(p=>Number(p.quantity)>0 && Number(p.quantity)<=Number(p.threshold||CFG.seuilDefaut));
  const valeurStock = PRODUCTS.reduce((s,p)=>s+Number(p.quantity||0)*Number(p.buyPrice||0),0);
  const jIn = JOURNAL.filter(j=>j.type==='Entrée' && inRange(j.date)).reduce((s,j)=>s+Number(j.montant),0);
  const jOut = JOURNAL.filter(j=>j.type==='Sortie' && inRange(j.date)).reduce((s,j)=>s+Number(j.montant),0);

  document.getElementById('r-output').innerHTML = `
    <div class="cards">
      <div class="kpi ok"><div class="lbl">Entrées stock (période)</div><div class="val num">${movIn.reduce((s,m)=>s+Number(m.quantity),0)}</div></div>
      <div class="kpi alert"><div class="lbl">Sorties stock (période)</div><div class="val num">${movOut.reduce((s,m)=>s+Number(m.quantity),0)}</div></div>
      <div class="kpi ok"><div class="lbl">Recettes (période)</div><div class="val num">${fmtMoney(jIn)}</div></div>
      <div class="kpi alert"><div class="lbl">Dépenses (période)</div><div class="val num">${fmtMoney(jOut)}</div></div>
      <div class="kpi"><div class="lbl">Valeur totale du stock</div><div class="val num">${fmtMoney(valeurStock)}</div></div>
    </div>
    <div class="panel"><h3>Produits les plus vendus</h3>
      ${topSold.length ? `<div class="tbl-wrap"><table><thead><tr><th>Produit</th><th>Quantité vendue</th></tr></thead>
      <tbody>${topSold.map(([n,q])=>`<tr><td>${esc(n)}</td><td class="num">${q}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Aucune vente sur la période</div>`}
    </div>
    <div class="panel"><h3>Produits en stock faible</h3>
      ${faible.length ? `<div class="tbl-wrap"><table><thead><tr><th>Produit</th><th>Qté</th><th>Seuil</th></tr></thead>
      <tbody>${faible.map(p=>`<tr><td>${esc(p.name)}</td><td class="num">${p.quantity}</td><td class="num">${p.threshold}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Rien à signaler</div>`}
    </div>
  `;
}

  document.getElementById('set-import-file').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(data.config) CFG = data.config;
        if(data.products) PRODUCTS = data.products;
        if(data.journal) JOURNAL = data.journal;
        if(data.suppliers) SUPPLIERS = data.suppliers;
        if(data.locations) LOCATIONS = data.locations;
        if(data.movements) MOVEMENTS = data.movements;
        if(data.momoPayments) MOMO_PAYMENTS = data.momoPayments;
        await Promise.all([saveCfg(),saveProducts(),saveJournal(),saveSuppliers(),saveLocations(),saveMovements(),saveMomoPayments()]);
        renderTopbar(); renderAll();
        showToast('Sauvegarde importée');
      }catch(err){ showToast('Fichier invalide'); }
    };
    reader.readAsText(file);
  });
  document.getElementById('set-save-account').addEventListener('click', async ()=>{
    const email = document.getElementById('set-email').value.trim();
    const pwd = document.getElementById('set-password').value;
    if(email) CFG.auth.email = email;
    if(pwd) CFG.auth.password = pwd;
    await saveCfg();
    // Synchroniser le registre global des comptes (utilisé pour la connexion)
    const acct = ACCOUNTS.find(a=>a.id===CURRENT_ACCOUNT.id);
    if(acct){
      if(email) acct.email = email;
      if(pwd) acct.password = pwd;
      await saveAccountsIndex();
    }
    showToast('Compte mis à jour');
  });
}

/* ============================================================
   INIT
============================================================ */
(async function init(){
  try{
    await loadAccountsIndex();
  }catch(e){
    console.error(e);
  }
  // L'utilisateur arrive toujours sur un écran d'accueil neutre avec un bouton
  // "Se connecter" — jamais connecté automatiquement à un compte précédent.
  authMode = 'landing';
  renderLogin();
})();
</script>
